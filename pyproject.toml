[project]
name = "publish-social"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "atproto", "Mastodon.py", "tweepy", "Pillow", "requests", "PyYAML", "python-dotenv", "keyring",
]

[dependency-groups]
dev = ["pytest"]
desktop = ["PySide6", "pyinstaller"]

[project.optional-dependencies]
browser = ["playwright"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
